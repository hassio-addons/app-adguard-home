---
configuration:
  log_level:
    name: רמת לוג
    description: >-
      שולט ברמת פלט הלוג של היישום וניתן לשנות אותו להיות
      מפורט יותר או פחות, מה שעשוי להיות שימושי כאשר מתמודדים עם
      בעיה לא מוכרת. כל רמה כוללת אוטומטית את ההודעות של רמה
      חמורה יותר.
  ssl:
    name: SSL
    description: >-
      מפעיל/משבית SSL מוצפן (HTTPS) לגישה ישירה ליישום.
      הגדרה זו אינה משפיעה על שירות ההטמעה.
  certfile:
    name: קובץ אישור
    description: >-
      קובץ האישור לשימוש עבור SSL. הקובץ חייב להיות מאוחסן בתיקייה
      `/ssl/`.
  keyfile:
    name: קובץ מפתח פרטי
    description: >-
      קובץ המפתח הפרטי לשימוש עבור SSL. הקובץ חייב להיות מאוחסן בתיקייה
      `/ssl/`.
  leave_front_door_open:
    name: השאר את הדלת הקדמית פתוחה
    description: >-
      משבית אימות ב-AdGuard Home כאשר מופעל. אנו ממליצים בחום
      נגד הפעלת אפשרות זו, אפילו ברשת פנימית. השימוש על אחריותך בלבד!
  safebrowsing_block_host:
    name: גלישה בטוחה - חסימת מארח
    description: >-
      שם המארח שיחליף את התשובה עבור בקשות שנחסמו על ידי גלישה בטוחה
      ברירת המחדל היא standard-block.dns.adguard.com, שמכווין לדף חסימה
      חיצוני של AdGuard.
  parental_block_host:
    name: בקרת הורים - חסימת מארח
    description: >-
      שם המארח שיחליף את התשובה עבור בקשות שנחסמו על ידי בקרת הורים
      ברירת המחדל היא family-block.dns.adguard.com, שמכווין לדף חסימה
      חיצוני של AdGuard.
network:
  53/udp: פורט שרת DNS
  80/tcp: ממשק אינטרנט (לא נדרש עבור הטמעה)
